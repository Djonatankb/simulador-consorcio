    --card:#FFFFFF; --texto:#3B3B4F; --texto-forte:#1E1E2E; --texto-suave:#8B8B9E;
    --borda:#E3E4EF; --livelo:#DF0979;
    --page:#F1F2F9;
    font-size:16px;
  }
  @media (prefers-color-scheme: dark){ :root{ --page:#15151F; } }
  :root[data-theme="dark"]{ --page:#15151F; }
  :root[data-theme="light"]{ --page:#F1F2F9; }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--page); color:var(--texto);
    display:flex; flex-direction:column; align-items:center;
  }
  .app{
    width:100%; min-height:100vh; min-height:100dvh; background:var(--fundo);
    display:flex; flex-direction:column; box-shadow:0 0 40px rgba(20,20,40,.12);
  }
  header{
    /* fundo escuro da marca (#211451) + logo na versão branca, conforme o guia.
       Estrutura estilo app de mensagens: avatar da Lígia + nome + status "online". */
    background:var(--roxo); color:#fff; position:sticky; top:0; z-index:5;
  }
  .header-container{
    max-width:860px; width:100%; margin:0 auto; padding:10px 16px;
    display:flex; align-items:center; gap:12px;
  }
  .avatar-header{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    background:var(--azul); background-image:var(--logo-simbolo);
    background-repeat:no-repeat; background-position:center; background-size:58%;
    border:2px solid rgba(255,255,255,.35);
  }
  header .titulo{flex:1; min-width:0;}
  header h1{
    font-family:'Montserrat',sans-serif;
    font-size:.92rem; font-weight:400; line-height:1.35; letter-spacing:.05em; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  header p{font-size:.76rem; opacity:.85; display:flex; align-items:center; gap:5px;}
  .online-dot{width:8px; height:8px; border-radius:50%; background:#3FD97C; flex-shrink:0;}
  .logo{
    width:80px; height:48px; flex-shrink:0;
    background:var(--logo-liga) no-repeat center/contain;
  }

  .chat{
    flex:1; padding:18px 14px 110px; display:flex; flex-direction:column; gap:10px; overflow-y:auto;
    /* textura pontilhada sutil, no espírito do papel de parede do WhatsApp */
    background-color:#E9E7F1;
    background-image:radial-gradient(rgba(33,20,81,.05) 1.2px, transparent 1.2px);
    background-size:22px 22px;
  }
  .chat > *{
    flex-shrink:0;
    max-width:860px; width:100%;
    margin-left:auto; margin-right:auto;
  } /* impede o carrossel (scroll container) de colapsar dentro do flex column, e limita largura no desktop */
  .row{display:flex; align-items:flex-end;}
  .row.user{justify-content:flex-end;}
  .bubble{
    position:relative; max-width:82%; padding:10px 14px 8px; border-radius:12px;

<script>
// ============ CONFIG ============
// Em produção: URL do Web App do Google Apps Script (backend/code.gs).
// Vazio = modo demonstração (SMS simulado em tela, planilha simulada no painel abaixo).
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbx2np8HzHEm6i1DSi1mWFQta3-6Wvdx7GyvJdt58QO4D4QK6rPlB3FwJtj478VLDjxf/exec";

// ---- Integração com o backend (Apps Script) ----
// POST com corpo text/plain (evita preflight de CORS, que o Apps Script não responde).
async function api(action, payload){
  const resp = await fetch(BACKEND_URL, { method:"POST", body: JSON.stringify({ action, ...payload }) });
  if(!resp.ok) throw new Error("HTTP " + resp.status);
  return resp.json();
}
function sincronizaLead(extra){
  if(!BACKEND_URL || !leadUuid) return;
  api("update_lead", { uuid: leadUuid, ...extra }).catch(err=>console.warn("update_lead falhou:", err));
}
// Airtable mistura formatos numéricos ("1.234,56", "R$ 480,01", 444.78) — converte todos para Number.
function numFlex(v){
  if(v==null || v==="") return null;
  if(typeof v==="number") return v;
  const s = String(v).replace(/[^\d.,-]/g,"");
  if(!s) return null;
  return s.includes(",") ? +s.replace(/\./g,"").replace(",",".") : +s;
}
// Normaliza um registro cru do Airtable para o modelo dos cartões.
// As colunas de lá têm espaços no fim ("Taxa Adm ") e um typo ("Pontos Livero" na tabela Imovel).
function mapPlanoBackend(campos, tipo){
  const f = {}; Object.keys(campos).forEach(k=> f[k.trim().toLowerCase()] = campos[k]);
  const pct = v => v==null ? null : String(v).replace("%","").trim();
  const demais = numFlex(f["demais parcelas"]), pf = numFlex(f["parcela pf"]);
  return {
    codigo: f["codigo"], descricao: f["descricao"], bem: tipo,
    imagem: f["imagem"] || IMG_BEM[tipo==="Imóvel" ? "Imovel" : "Auto"],
    credito: numFlex(f["credito"]), prazo: numFlex(f["prazo"]),
    inicial: numFlex(f["parcelas de 01 a 12"]), demais: demais, pf: pf,
    redutor: pct(f["redutor"]), taxa: pct(f["taxa adm"]), adesao: pct(f["taxa de adesão"]),
    fundo: pct(f["fundo de reserva"]), grupo: f["plano"], status: String(f["status"]||"").trim(),
    pontos: numFlex(f["pontos livelo"] ?? f["pontos livero"]) || 0,
    parcelaCard: demais ?? pf
  };
}

// ============ ESTADO ============
const lead = { nome:"", email:"", telefone:"", verificado:"", tipo:"", valor:"", plano:"", credito:"", parcela:"", status:"" };
let otpEsperado = null;
let leadUuid = null; // id da linha na planilha quando o backend está ativo

const chat = document.getElementById("chat");
const fmt = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const hora = () => new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

function atualizaPlanilha(status){
  if(status) lead.status = status;
  const tds = document.querySelectorAll("#leadRow td");
  const vals = [new Date().toLocaleString("pt-BR"), lead.nome, lead.email, lead.telefone, lead.verificado,
                lead.tipo, lead.valor && fmt(+lead.valor), lead.plano, lead.credito && fmt(+lead.credito),
                lead.parcela, lead.status];
  tds.forEach((td,i)=> td.textContent = vals[i] || "");
}

// ============ RENDER ============
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function scrollFim(){ chat.scrollTo({top:chat.scrollHeight, behavior:"smooth"}); window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}); }

function botMsg(html){
  const n = el(`<div class="row"><div class="bubble">${html}<span class="hora-msg">${hora()}</span></div></div>`);
  chat.appendChild(n); scrollFim(); return n.querySelector(".bubble");
}
function userMsg(texto){
  chat.appendChild(el(`<div class="row user"><div class="bubble">${texto}<span class="hora-msg">${hora()} <span class="checks" aria-hidden="true">✓✓</span></span></div></div>`));
  scrollFim();
}
function digitando(ms){
  const n = el(`<div class="row"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`);
  chat.appendChild(n); scrollFim();
  return new Promise(r=>setTimeout(()=>{ n.remove(); r(); }, ms));
}
function pergunta(html, opts={}){
  return new Promise(resolve=>{
    const bolha = botMsg(html);
    const box = el(`<div class="inline-input">${opts.prefixo?`<span class="prefix">${opts.prefixo}</span>`:""}<input type="${opts.tipo||"text"}" inputmode="${opts.inputmode||"text"}" placeholder="${opts.placeholder||"Digite aqui"}" aria-label="resposta"><button type="button" aria-label="Enviar">➤</button></div>`);
    const hint = el(`<div class="hint">Enter para enviar</div>`);
    bolha.append(box, hint);
    const input = box.querySelector("input");
    input.focus();
    const enviar = ()=>{
      const v = input.value.trim();
      if(!v) return;
      if(opts.valida && !opts.valida(v)){
        bolha.querySelector(".erro")?.remove();
        bolha.appendChild(el(`<div class="erro">${opts.msgErro}</div>`));
        return;
      }
      box.remove(); hint.remove(); bolha.querySelector(".erro")?.remove();
      userMsg((opts.prefixo?opts.prefixo+" ":"") + (opts.eco?opts.eco(v):v));
      resolve(v);
    };
    box.querySelector("button").onclick = enviar;
    input.addEventListener("keydown", e=>{ if(e.key==="Enter") enviar(); });
    scrollFim();
  });
}
function botoes(lista){
  return new Promise(resolve=>{
    chat.appendChild(el(`<div class="escolha-label">Escolha uma opção</div>`));
    const wrap = el(`<div class="opcoes"></div>`);
    lista.forEach(rotulo=>{
      const b = el(`<button type="button">${rotulo}</button>`);
      b.onclick = ()=>{ wrap.remove(); userMsg(rotulo); resolve(rotulo); };
      wrap.appendChild(b);
    });
    chat.appendChild(wrap); scrollFim();
  });
}

function smsToast(codigo){

}

const IMG_BEM = {
  Imovel:"https://ligaconsorcio.s3.us-east-2.amazonaws.com/midiaimovelporto.png",
  Auto:"https://ligaconsorcio.s3.us-east-2.amazonaws.com/midiaautoporto.png"

function gerarPlanos(tipo, valor){
  const t = tipo==="Imóvel" ? "Imovel" : "Auto";
  const busca = f => PLANOS.filter(p=>p.t===t && p.cr>valor*(1-f) && p.cr<valor*(1+f)).sort((a,b)=>a.cr-b.cr);
  let lista = busca(0.10);
  if(!lista.length) lista = busca(0.20);
  return lista.map(p=>({
    codigo:p.c, descricao:p.d, imagem:IMG_BEM[t], bem:tipo, prazo:p.pz, credito:p.cr,
    taxa:p.tx, adesao:p.ad, fundo:p.fr, redutor:p.red, grupo:p.g, status:p.st,
    demais:p.dp, inicial:p.p112, pf:p.pf, pontos:p.pl,
    parcelaCard: p.dp ?? p.pf
  }));
}
function carrossel(planos){
  return new Promise(resolve=>{
    botMsg("<strong>Escolha um plano:</strong>");
    chat.appendChild(el(`<div class="escolha-label">Escolha uma opção</div>`));

    planos.forEach(p=>{
      const card = el(`<div class="plano">
        <img class="foto" src="${p.imagem}" alt="${p.bem}" width="800" height="800" onerror="this.remove()">

          <dl>
            <div><dt>Prazo:</dt> ${p.prazo} meses</div>

      c.appendChild(card);
    });
    chat.appendChild(c); scrollFim();
  });
}

// ============ FORMULÁRIO DE PROPOSTA ============
// Máscaras progressivas (aplicadas no evento input) e validação de dígitos verificadores.
const soDigitos = v => v.replace(/\D/g,"");
const MASCARAS = {
  data: v => soDigitos(v).slice(0,8)
    .replace(/^(\d{2})(\d)/,"$1/$2")
    .replace(/^(\d{2}\/\d{2})(\d)/,"$1/$2"),
  cpfcnpj: v => { const d = soDigitos(v).slice(0,14);
    return d.length<=11
      ? d.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3}\.\d{3})(\d)/,"$1.$2").replace(/^(\d{3}\.\d{3}\.\d{3})(\d)/,"$1-$2")
      : d.replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2}\.\d{3})(\d)/,"$1.$2").replace(/^(\d{2}\.\d{3}\.\d{3})(\d)/,"$1/$2").replace(/^(\d{2}\.\d{3}\.\d{3}\/\d{4})(\d)/,"$1-$2");
  },
  cep: v => soDigitos(v).slice(0,8).replace(/^(\d{5})(\d)/,"$1-$2")
};
function validaCPF(d){
  if(d.length!==11 || /^(\d)\1{10}$/.test(d)) return false;
  for(const n of [9,10]){
    let s=0; for(let i=0;i<n;i++) s += +d[i]*((n+1)-i);
    if((s*10)%11%10 !== +d[n]) return false;
  }
  return true;
}
function validaCNPJ(d){
  if(d.length!==14 || /^(\d)\1{13}$/.test(d)) return false;
  const dv = n => {
    const pesos = n===12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    let s=0; for(let i=0;i<n;i++) s += +d[i]*pesos[i];
    const r = s%11; return r<2 ? 0 : 11-r;
  };
  return dv(12)===+d[12] && dv(13)===+d[13];
}
function validaDataNascimento(v){
  const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return false;
  const dd=+m[1], mm=+m[2], aa=+m[3];
  const dt = new Date(aa, mm-1, dd);
  return dt.getFullYear()===aa && dt.getMonth()===mm-1 && dt.getDate()===dd
    && aa>=1900 && dt <= new Date();
}
function formProposta(){
  return new Promise(resolve=>{
    const bolha = botMsg("<p>Para análise da proposta, precisaremos de <strong>algumas informações complementares:</strong></p>");
    const campos = [
      ["nome_completo","Nome Completo*","Digite o seu nome e sobrenome","full"],
      ["cpf","CPF/CNPJ*","Digite o CPF ou CNPJ",null,"cpfcnpj"],
      ["nascimento","Data de Nascimento*","dd/mm/aaaa",null,"data"],
      ["rg","RG*","Número do RG"],
      ["orgao","Órgão Emissor*","Ex.: SSP-ES"],
      ["naturalidade","Naturalidade*","Cidade e UF"],
      ["nome_mae","Nome Completo da Mãe*","Nome completo"],
      ["endereco","Endereço Completo*","Rua, número, cidade, estado","full"],
      ["cep","CEP*","Somente números",null,"cep"]
    ];
    const form = el(`<form class="proposta">${campos.map(([id,rot,ph,cls])=>
      `<div class="${cls||""}"><label for="${id}">${rot}</label><input id="${id}" required placeholder="${ph}"></div>`).join("")}
      <button type="submit">Continuar</button></form>`);
    campos.forEach(([id,,,,mask])=>{
      if(!mask) return;
      const inp = form.querySelector("#"+id);
      inp.setAttribute("inputmode","numeric");
      inp.addEventListener("input", ()=>{ inp.value = MASCARAS[mask](inp.value); });
    });
    form.onsubmit = e=>{
      e.preventDefault();
      form.querySelector(".erro")?.remove();
      const doc = soDigitos(form.querySelector("#cpf").value);
      const docOk = doc.length===11 ? validaCPF(doc) : validaCNPJ(doc);
      const erros = [
        [!docOk, "#cpf", "CPF/CNPJ inválido — confira os dígitos."],
        [!validaDataNascimento(form.querySelector("#nascimento").value), "#nascimento", "Data de nascimento inválida — use dd/mm/aaaa."]
      ];
      const falha = erros.find(([cond])=>cond);
      if(falha){
        const [,sel,msg] = falha;
        form.querySelector("button").before(el(`<div class="erro full">${msg}</div>`));
        form.querySelector(sel).focus();
        return;
      }
      const dados = Object.fromEntries(campos.map(([id])=>[id, form.querySelector("#"+id).value]));
      form.remove();
      userMsg("Dados enviados ✓");
      resolve(dados);
    };
    bolha.appendChild(form); scrollFim();
  });
}

  atualizaPlanilha();

  await digitando(700);
  lead.email = await pergunta(`Ótimo! Para simular o consórcio de um ${lead.tipo}, <strong>precisarei de algumas informações.</strong><p>Qual é o seu <strong>e-mail?</strong></p>`,
    {placeholder:"Digite aqui o seu email", tipo:"email",
     valida:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), msgErro:"Digite um email válido"});
  atualizaPlanilha();

  await digitando(700);
  lead.telefone = await pergunta("Qual o número do <strong>seu celular (com DDD)?</strong>",
    {placeholder:"Digite aqui", inputmode:"tel",
     valida:v=>/^\d{10,11}$/.test(v.replace(/\D/g,"")), msgErro:"Digite um telefone válido (DDD + número)"});
  lead.telefone = lead.telefone.replace(/\D/g,"");
  atualizaPlanilha();

  // ---- OTP ----
  await digitando(800);
  if(BACKEND_URL){
    try{
      const envio = await api("send_otp", { telefone: lead.telefone });
      if(!envio.ok) botMsg(`⚠️ ${envio.erro || "Não consegui enviar o SMS agora. Tente novamente em alguns minutos."}`);
      else if(envio.demo_codigo) smsToast(envio.demo_codigo); // gateway ainda não contratado: o backend devolve o código (modo teste)
    }catch(err){ botMsg("⚠️ Falha ao contatar o servidor. Verifique sua conexão e tente de novo."); }
  }else{
    otpEsperado = String(Math.floor(1500+Math.random()*8000)); // mesma faixa do bot atual: Random(1500,9500)
    smsToast(otpEsperado); // demonstração sem backend: o "SMS" aparece só na tela
  }
  let ok = false;
  let msg = "Vou te enviar um código por SMS para o número que você informou.<p>É rapidinho! Isso me ajuda a garantir a segurança das informações.</p><p>Assim que receber o código no seu celular, digite aqui para continuar.</p>";
  while(!ok){
    const cod = await pergunta(msg, {prefixo:"Informe o código:", placeholder:"0000", inputmode:"numeric"});
    let erroVerif = "";
    if(BACKEND_URL){
      try{
        const r = await api("verify_otp", { telefone: lead.telefone, codigo: cod.replace(/\D/g,""),
                                            nome: lead.nome, email: lead.email, tipo: lead.tipo });
        ok = !!r.ok;
        if(ok) leadUuid = r.uuid; else erroVerif = r.erro || "";
      }catch(err){ ok = false; }
    }else{
      ok = (cod.replace(/\D/g,"") === otpEsperado);
    }
    if(!ok){ await digitando(500); msg = erroVerif ? `⚠️ ${erroVerif}` : "Hmm, esse código não confere. <strong>Tente novamente:</strong>"; }
  }
  document.querySelector(".sms-toast")?.remove(); // código validado → dispensa a notificação
  lead.verificado = "sim";
  atualizaPlanilha("lead verificado ✓"); // com backend, verify_otp acabou de gravar a linha na planilha real

  // ---- Simulação ----
  // "Escolher outro" volta para esta pergunta (mesmo comportamento do bot atual),
  // permitindo simular outro valor de crédito sem repetir as perguntas de lead.
  let plano, acao, primeiraVez = true;
  while(true){
    await digitando(700);
    lead.valor = (await pergunta(primeiraVez
        ? "Certo, agora me informe qual o <strong>valor do crédito desejado:</strong>"
        : "Sem problemas! Me informe o <strong>valor do crédito desejado:</strong>",
      {prefixo:"R$", placeholder:"Digite aqui", inputmode:"numeric",
       valida:v=>{const n=+v.replace(/\D/g,""); return n>=20000 && n<=1200000;},
       msgErro:"Informe um valor entre R$ 20.000 e R$ 1.200.000",
       eco:v=>(+v.replace(/\D/g,"")).toLocaleString("pt-BR")})).replace(/\D/g,"");
    primeiraVez = false;
    lead.plano = lead.credito = lead.parcela = ""; // nova simulação limpa o plano anterior
    atualizaPlanilha("simulou");
    sincronizaLead({ valor: lead.valor, status: "simulou" });

    await digitando(1200);
    let planos = null;
    if(BACKEND_URL){
      try{
        const r = await api("get_plans", { tipo: lead.tipo, valor: +lead.valor });
        if(r.ok) planos = r.planos.map(p=>mapPlanoBackend(p, lead.tipo));
      }catch(err){ console.warn("get_plans falhou, usando tabela embutida:", err); }
    }
    if(!planos || !planos.length) planos = gerarPlanos(lead.tipo, +lead.valor);
    if(!planos.length){
      // Nenhum plano na faixa (±10% e ±20%) — informa os limites reais e volta a perguntar o valor.
      const t = lead.tipo==="Imóvel" ? "Imovel" : "Auto";
      const creditos = PLANOS.filter(p=>p.t===t).map(p=>p.cr);
      botMsg(`Poxa, não encontrei planos de <strong>${lead.tipo}</strong> com crédito próximo de <strong>${fmt(+lead.valor)}</strong>. 😕<p>Hoje, para ${lead.tipo==="Imóvel"?"imóveis":"automóveis"}, os créditos vão de <strong>${fmt(Math.min(...creditos))}</strong> até <strong>${fmt(Math.max(...creditos))}</strong>.</p>`);
      continue;
    }
    plano = await carrossel(planos);
    lead.plano = plano.codigo;
    lead.credito = plano.credito;
    lead.parcela = fmt(plano.parcelaCard);
    atualizaPlanilha("escolheu plano");
    sincronizaLead({ valor: lead.valor, plano: lead.plano, credito: lead.credito, parcela: lead.parcela, status: "escolheu plano" });

    const parcelas = plano.demais!=null
      ? `<dt>Parcela de 01 a 12:</dt><dd>${fmt(plano.inicial)}</dd>
         <dt>Demais parcelas:</dt><dd>${fmt(plano.demais)}</dd>`
      : `<dt>Parcela mensal:</dt><dd>${fmt(plano.pf)}</dd>`;
    await digitando(800);
    botMsg(`<u><strong>Você escolheu o plano:</strong></u> 😊<dl class="detalhe" style="margin-top:10px">
      <dt>Descrição:</dt><dd>${plano.descricao}</dd>
      <dt>Valor do crédito:</dt><dd>${fmt(plano.credito)}</dd>
      <dt>Prazo:</dt><dd>${plano.prazo} meses</dd>
      ${parcelas}
      <dt>Redução até contemplação:</dt><dd>${plano.redutor}%</dd>
      <dt class="pontos">Pontos <span class="brand-livelo" role="img" aria-label="Livelo"></span></dt><dd class="pontos">${plano.pontos.toLocaleString("pt-BR")}</dd>
    </dl><p class="administradora">Consórcio administrado por <span class="brand-porto" role="img" aria-label="Porto Seguro Bank"></span></p>
    <p style="margin-top:10px"><strong>O que deseja fazer?</strong></p>`);
    acao = await botoes(["Escolher outro","Trocar tipo de bem","Ver detalhes do Grupo","Contratar"]);

    if(acao==="Ver detalhes do Grupo"){
      await digitando(800);
      const ehImovel = plano.demais!=null;
      botMsg(`<strong>Detalhes do Grupo:</strong><dl class="detalhe" style="margin-top:10px">
        <dt>Taxa de administração:</dt><dd>${plano.taxa}%</dd>
        ${plano.adesao?`<dt>Taxa de adesão:</dt><dd>${plano.adesao}%</dd>`:""}
        <dt>Fundo de reserva:</dt><dd>${plano.fundo}%</dd>
        <dt>Seguro de vida:</dt><dd>Não possui</dd>
        <dt>Reajuste anual:</dt><dd>${ehImovel?"A média entre IPCA e INCC":"IPCA"}</dd>
        <dt>Sorteio:</dt><dd>1 por mês</dd>
        <dt>Lance Fixo:</dt><dd>${ehImovel?"40%":"Não possui"}</dd>
        <dt>Lance Embutido:</dt><dd>${ehImovel?"30%":"15%"}</dd>
        <dt>Lance Livre:</dt><dd>Todas que o saldo do grupo permitir</dd>
        <dt>Status do Grupo:</dt><dd>${plano.status}</dd>
      </dl><p style="margin-top:10px"><strong>O que deseja fazer?</strong></p>`);
      acao = await botoes(["Escolher outro","Trocar tipo de bem","Contratar"]);
    }
    if(acao==="Contratar") break;
    if(acao==="Trocar tipo de bem"){
      await digitando(600);
      botMsg(`Claro! Você quer simular um consórcio <strong>para qual tipo de bem?</strong>`);
      lead.tipo = await botoes(["Imóvel","Automóvel"]);
      atualizaPlanilha();
    }
    // Escolher outro / trocar tipo → volta à pergunta do valor do crédito
  }

  // ---- Proposta ----
  await digitando(800);
  const proposta = await formProposta();
  atualizaPlanilha("proposta enviada 🎉");
  sincronizaLead({ status: "proposta enviada", proposta: proposta });

  await digitando(900);
  botMsg(`Perfeito, <strong>${lead.nome}</strong>! 🎉<p>Sua proposta foi registrada com sucesso. Um de nossos consultores entrará em contato pelo número informado para finalizar a contratação.</p><p>Obrigado por usar o simulador da <strong>Liga Vitória</strong>!</p>`);
  await botoes(["Fazer nova simulação"]);
  chat.innerHTML=""; Object.keys(lead).forEach(k=>lead[k]=""); leadUuid = null;
  fluxo();
}
fluxo();
</script>
